<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
<title id="title">Averaging two numbers</title>
<desc id="desc">Start with the column zero, one. Equal cross-weights of one quarter put the first output at one quarter and the second at three quarters. At one half they coincide. At three quarters the order reverses.</desc>
<rect width="480" height="270" fill="#faf9f5" rx="8"/>
<g font-family="system-ui, sans-serif"><text x="164" y="43" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">0</text><line x1="164" y1="52" x2="164" y2="210" stroke="#becbc9" stroke-width="1" stroke-dasharray="5 5"/><text x="308" y="43" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">½</text><line x1="308" y1="52" x2="308" y2="210" stroke="#becbc9" stroke-width="1" stroke-dasharray="5 5"/><text x="452" y="43" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">1</text><line x1="452" y1="52" x2="452" y2="210" stroke="#becbc9" stroke-width="1" stroke-dasharray="5 5"/><text x="22" y="80" text-anchor="start" font-size="16" fill="#243546" font-weight="400">a = b = ¼</text><line x1="164" y1="75" x2="452" y2="75" stroke="#becbc9" stroke-width="2"/><line x1="236.0" y1="66" x2="236.0" y2="75" stroke="#17665f" stroke-width="2"/><line x1="380.0" y1="75" x2="380.0" y2="84" stroke="#8d4435" stroke-width="2"/><circle cx="236.0" cy="66" r="5" fill="#17665f" stroke="none" stroke-width="2"/><path d="M380.0,78 l6,6 -6,6 -6,-6 Z" fill="#8d4435"/><text x="22" y="141" text-anchor="start" font-size="16" fill="#243546" font-weight="400">a = b = ½</text><line x1="164" y1="136" x2="452" y2="136" stroke="#becbc9" stroke-width="2"/><line x1="308.0" y1="127" x2="308.0" y2="136" stroke="#17665f" stroke-width="2"/><line x1="308.0" y1="136" x2="308.0" y2="145" stroke="#8d4435" stroke-width="2"/><circle cx="308.0" cy="127" r="5" fill="#17665f" stroke="none" stroke-width="2"/><path d="M308.0,139 l6,6 -6,6 -6,-6 Z" fill="#8d4435"/><text x="22" y="202" text-anchor="start" font-size="16" fill="#243546" font-weight="400">a = b = ¾</text><line x1="164" y1="197" x2="452" y2="197" stroke="#becbc9" stroke-width="2"/><line x1="380.0" y1="188" x2="380.0" y2="197" stroke="#17665f" stroke-width="2"/><line x1="236.0" y1="197" x2="236.0" y2="206" stroke="#8d4435" stroke-width="2"/><circle cx="380.0" cy="188" r="5" fill="#17665f" stroke="none" stroke-width="2"/><path d="M236.0,200 l6,6 -6,6 -6,-6 Z" fill="#8d4435"/><circle cx="70" cy="244" r="5" fill="#17665f" stroke="none" stroke-width="2"/><text x="82" y="249" text-anchor="start" font-size="15" fill="#243546" font-weight="400">first output</text><path d="M268,238 l6,6 -6,6 -6,-6 Z" fill="#8d4435"/><text x="282" y="249" text-anchor="start" font-size="15" fill="#243546" font-weight="400">second output</text></g>
</svg>
