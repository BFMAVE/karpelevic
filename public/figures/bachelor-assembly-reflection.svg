<title id="plot-title">The reflected arc at order four</title>
<desc id="plot-description">Upper boundary arc from a quarter turn to a third of a turn, and its reflection below the real axis. The marked points at seven and seventeen twenty-fourths of a turn have the same radius. The dashed curve is the unit circle.</desc>
