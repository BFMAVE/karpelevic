<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 426 330" width="426" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The first arcs at orders four and five</title>
  <desc id="desc">The ray at forty-five degrees first intersects the order-four chord from one to i, then the order-five chord from one to the fifth root of unity at seventy-two degrees. Both chords and both ray intersections are drawn at the same scale.</desc>
  <rect width="100%" height="100%" fill="#fffdfa"/>
  <g font-family="Georgia, serif" font-size="18" fill="#242e30">
<path d="M 32 286 H 338 M 56 306 V 26" stroke="#747d79" stroke-width="1.4" fill="none"/>
    <path d="M 56.000 54.000 A 232 232 0 0 1 288.000 286.000" fill="none" stroke="#adb4ae" stroke-width="1.7" stroke-dasharray="4 4"/>
    <path d="M 56.000 286.000 L 239.280 102.720" stroke="#63706d" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
    <path d="M 56.000 54.000 L 288.000 286.000" stroke="#944b32" stroke-width="2.8" fill="none"/>
    <path d="M 127.692 65.355 L 288.000 286.000" stroke="#126a68" stroke-width="3" fill="none" stroke-dasharray="9 4"/>
    <circle cx="172.000" cy="170.000" r="4.5" fill="#944b32"/>
    <rect x="185.873" y="147.127" width="9" height="9" fill="#126a68"/>
    <circle cx="56" cy="54" r="3.8" fill="#944b32"/><circle cx="127.692" cy="65.355" r="3.8" fill="#126a68"/>
    <circle cx="288" cy="286" r="3.8" fill="#303a38"/>
    <text x="46" y="306" text-anchor="end">0</text><text x="288" y="310" text-anchor="middle">1</text><text x="42" y="57" text-anchor="end" font-style="italic">i</text>
    <text x="129.692" y="53.355">exp(2πi/5)</text>
    <text x="248" y="105">π/4 ray</text>
    <path d="M 168.000 171.000 L 150 175 H 124" stroke="#944b32" fill="none"/>
    <text x="120" y="181" fill="#783b2a" text-anchor="end" font-size="16">order 4</text>
    <path d="M 194.373 151.627 H 266" stroke="#126a68" fill="none"/>
    <text x="272" y="156.627" fill="#125553" font-size="16">order 5</text>
  </g>
</svg>
