 -6,6 -6,-6 Z" fill="#17665f"/><line x1="55" y1="207" x2="107" y2="147" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><path d="M107,141 l6,6 -6,6 -6,-6 Z" fill="#17665f"/><line x1="107" y1="147" x2="159" y2="87" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><path d="M159,81 l6,6 -6,6 -6,-6 Z" fill="#17665f"/><line x1="159" y1="87" x2="211" y2="187" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="211" cy="187" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><line x1="211" y1="187" x2="263" y2="127" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="263" cy="127" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><line x1="263" y1="127" x2="315" y2="67" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><path d="M315,61 l6,6 -6,6 -6,-6 Z" fill="#17665f"/><line x1="315" y1="67" x2="367" y2="167" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="367" cy="167" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><line x1="367" y1="167" x2="419" y2="107" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="419" cy="107" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><line x1="419" y1="107" x2="471" y2="207" stroke="#94a4a3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="471" cy="207" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><line x1="159" y1="79" x2="159" y2="49" stroke="#8d4435" stroke-width="2"/><text x="169" y="72" text-anchor="start" font-size="14" fill="#8d4435" font-weight="600">2 left</text><path d="M65,255 l5,5 -5,5 -5,-5 Z" fill="#17665f"/><text x="78" y="265" text-anchor="start" font-size="14" fill="#243546" font-weight="400">new record</text><circle cx="208" cy="260" r="4" fill="#faf9f5" stroke="#243546" stroke-width="2"/><text x="220" y="265" text-anchor="start" font-size="14" fill="#243546" font-weight="400">other residue</text></g>
