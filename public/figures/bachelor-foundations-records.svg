<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 286" role="img" aria-labelledby="title desc">
<title id="title">Record residues for a shift of three modulo eight</title>
<desc id="desc">At times zero through eight the residues are zero, three, six, one, four, seven, two, five, zero. The first three and the point at time five are records. At time two the gap to eight is two.</desc>
<rect width="522" height="286" fill="#faf9f5" rx="8"/>
