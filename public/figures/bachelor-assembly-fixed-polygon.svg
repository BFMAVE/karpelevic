<title id="plot-title">One hexagon for every rotation</title>
<desc id="plot-description">A regular hexagon with unit circumradius rotates through thirty degrees. Its marked vertex touches a side of the enlarged hexagon. That hexagon also contains the unit disk, so the same enlargement covers every angle.</desc>
