<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 278" role="img" aria-labelledby="title desc">
<title id="title">Which side owns the reverse-chain contact?</title>
<desc id="desc">Schematic of the five vertices seven, six, five, four and three in decreasing order. Internal sides six and five have fixed contacts from bases one and seven. The exceptional contact on side four comes from moving base six after three steps. Straight placement shows index order only.</desc>
<rect width="500" height="278" fill="#faf9f5" rx="8"/>
<g font-family="system-ui, sans-serif"><text x="20" y="30" text-anchor="start" font-size="17" fill="#243546" font-weight="600">Follow the chain from v₇ to v₃</text><line x1="53" y1="94" x2="445" y2="94" stroke="#243546" stroke-width="2"/><circle cx="53" cy="94" r="5" fill="#faf9f5" stroke="#243546" stroke-width="2"/><text x="53" y="78" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">v₇</text><circle cx="151" cy="94" r="5" fill="#243546" stroke="#243546" stroke-width="2"/><text x="151" y="78" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">v₆</text><circle cx="249" cy="94" r="5" fill="#243546" stroke="#243546" stroke-width="2"/><text x="249" y="78" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">v₅</text><circle cx="347" cy="94" r="5" fill="#243546" stroke="#243546" stroke-width="2"/><text x="347" y="78" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">v₄</text><circle cx="445" cy="94" r="5" fill="#faf9f5" stroke="#243546" stroke-width="2"/><text x="445" y="78" text-anchor="middle" font-size="18" fill="#243546" font-weight="400">v₃</text><text x="102" y="122" text-anchor="middle" font-size="16" fill="#243546" font-weight="400">E₇</text><text x="200" y="122" text-anchor="middle" font-size="16" fill="#243546" font-weight="400">E₆</text><path d="M200,89 l5,5 -5,5 -5,-5 Z" fill="#17665f"/><text x="200" y="150" text-anchor="middle" font-size="15" fill="#17665f" font-weight="400">c₆</text><text x="298" y="122" text-anchor="middle" font-size="16" fill="#243546" font-weight="400">E₅</text><path d="M298,89 l5,5 -5,5 -5,-5 Z" fill="#17665f"/><text x="298" y="150" text-anchor="middle" font-size="15" fill="#17665f" font-weight="400">c₅</text><text x="396" y="122" text-anchor="middle" font-size="16" fill="#243546" font-weight="400">E₄</text><path d="M396,89 l5,5 -5,5 -5,-5 Z" fill="#8d4435"/><text x="396" y="150" text-anchor="middle" font-size="15" fill="#8d4435" font-weight="400">c₄</text><line x1="23" y1="170" x2="472" y2="170" stroke="#becbc9" stroke-width="1"/><text x="20" y="200" text-anchor="start" font-size="15" fill="#17665f" font-weight="600">Fixed sources</text><text x="20" y="225" text-anchor="start" font-size="18" fill="#243546" font-weight="400">v₁ → c₆</text><text x="20" y="250" text-anchor="start" font-size="18" fill="#243546" font-weight="400">v₇ → v₁₂ → v₀ → c₅</text><text x="256" y="200" text-anchor="start" font-size="15" fill="#8d4435" font-weight="600">Closing return</text><text x="256" y="225" text-anchor="start" font-size="18" fill="#243546" font-weight="400">v₆ → v₁₁ → v₁₆ → c₄</text></g>
</svg>
