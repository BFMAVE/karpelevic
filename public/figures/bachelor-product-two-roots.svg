<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 312" width="570" height="312" role="img" aria-labelledby="title desc">
  <title id="title">Two polynomial roots in the first Farey sector</title>
  <desc id="desc">The two roots lie inside the same sector measured from zero. Measured from two thirds, the solid factor makes an angle of sixty degrees and the dashed factor an angle of one hundred twenty degrees.</desc>
  <rect width="100%" height="100%" fill="#fffdfa"/>
  <g font-family="Georgia, serif" font-size="18" fill="#242e30">
