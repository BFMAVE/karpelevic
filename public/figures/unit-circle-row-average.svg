<svg xmlns="http://www.w3.org/2000/svg" width="466" height="302" viewBox="0 0 466 302" role="img" aria-labelledby="circle-title circle-desc">
  <title id="circle-title">A row average on the edge of the unit disk</title>
  <desc id="circle-desc">The vertical line through one touches the disk only at one. The segment joining i and one has midpoint (1+i)/2. A dashed line drops from that midpoint to one half on the real axis.</desc>
  <rect width="466" height="302" fill="#fcfaf4"/>
  <circle cx="162" cy="151" r="110" fill="#e8f0eb" stroke="#526c75" stroke-width="2"/>
  <g stroke="#90a1a2" stroke-width="1.2" fill="none">
    <path d="M32 151 H425 M162 27 V275"/>
  </g>
  <path d="M272 24 V278" stroke="#1c5663" stroke-width="2.5"/>
  <path d="M162 41 L272 151" stroke="#99493c" stroke-width="2.4"/>
  <path d="M217 96 V151" stroke="#99493c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M223 93 L301 55 H318" fill="none" stroke="#835147" stroke-width="1.2"/>
  <g fill="#244650">
    <circle cx="162" cy="41" r="4"/>
    <circle cx="272" cy="151" r="4.5"/>
    <circle cx="162" cy="151" r="2.5"/>
  </g>
  <rect x="212.5" y="91.5" width="9" height="9" rx="1" fill="#99493c"/>
  <g font-family="Georgia, serif" font-size="17" fill="#203e49">
    <text x="146" y="34" font-style="italic">i</text>
    <text x="145" y="173">0</text>
    <text x="281" y="171">1</text>
    <text x="217" y="173" text-anchor="middle">½</text>
    <text x="325" y="61" fill="#793d32">(1 + i)/2</text>
    <text x="379" y="173">Re w</text>
    <text x="283" y="256" fill="#1c5663">Re w = 1</text>
  </g>
</svg>
