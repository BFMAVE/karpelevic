<title id="plot-title">Why the branching weights are in the ratio one to rho</title>
<desc id="plot-description">After rotating the equation by minus h, a vector of length beta points down by angle h and a vector of length alpha divided by rho points up by angle h. Their sum is real. The dropped and regained heights are equal.</desc>
